# Caddy with two CDN backends.
# Set both admin fields in a private copy for a fresh install from YAML.
# admin_username: vpn-admin
# admin_password: "change this password"
domain: example.com
email: admin@example.com
# docker_user: deploy  # Uses the user who ran sudo when omitted.
https: caddy
reality: true
direct_xhttp: true
nftguard:
  enabled: true
  dry_run: false
  enable_vk_output: false
  allow_cidrs: ""  # Comma-separated management IPv4 addresses or CIDRs.
  allow_cidrs6: ""  # Comma-separated management IPv6 addresses or CIDRs.
# Uncomment this group to select a REALITY SNI when applying this file.
# reality_sni_auto: true
# reality_sni_scan: top10  # Or scanner to discover names in an IPv4 subnet.
# reality_sni: [www.cloudflare.com, www.microsoft.com]  # Fallback order.
# The following options are valid with scanner only.
# reality_sni_scan_cidr: 192.0.2.0/28  # Defaults to the VPS subnet.
# reality_sni_scan_timeout: 30
# To use and check a manual name instead:
# reality_sni_auto: false
# reality_sni: [www.cloudflare.com]
# inbound_templates:
#   direct_xhttp: /etc/setup-3x-ui/templates/direct-xhttp.json
cdn:
  - provider: selectel
    edge: edge.example.com
    path: /media/hls/9636f214/index.m3u8
  - provider: yandex
    edge: edge2.example.com
    path: generate
