name: Tests and Caddy image

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: Debian 13
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: |
          for script in install.sh setup-3x-ui tests/sandbox/run.sh; do
            sh -n "$script"
          done
      - name: Run sandbox tests
        run: ./tests/sandbox/run.sh --report-only
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage-report/coverage.txt
            coverage-report/coverage.json

  coverage:
    name: 95% lines and branches
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: coverage
          path: coverage-report
      - name: Check coverage thresholds
        run: python3 tests/sandbox/report.py coverage-report/coverage.json

  publish-caddy:
    name: Publish Caddy to GHCR
    needs: tests
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release notes
        run: python3 .github/release_notes.py "$GITHUB_REF_NAME" >/dev/null
      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish Caddy
        env:
          CADDY_DOCKERFILE: setup3ui/assets/Caddy.Dockerfile
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-caddy"
          recipe=$(sha256sum "$CADDY_DOCKERFILE")
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image:$GITHUB_REF_NAME" --tag "$image:sha256-${recipe%% *}" \
            - < "$CADDY_DOCKERFILE"
      - name: Check Layer 4 in the published image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-caddy:$GITHUB_REF_NAME"
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --pull=always --platform "$platform" --entrypoint sh "$image" -ec '
              test -s /usr/share/licenses/caddy/Caddy-LICENSE
              test -s /usr/share/licenses/caddy/Caddy-Layer4-LICENSE
              caddy list-modules
            ' | grep -Fx 'layer4.handlers.proxy'
          done

  publish-release:
    name: Create GitHub Release
    needs: publish-caddy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: github-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
            exit 0
          fi
          python3 .github/release_notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
